<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — DolphinEngineering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    :root {
      --bg: #05020e; --bg2: #09041a; --bg3: #0f0627;
      --pu: #a855f7; --pu2: #7c3aed; --bl: #60a5fa;
      --tx: #ede8f8; --tx2: #9d87bf; --tx3: #4e3a6e;
      --brd: #160537; --brd2: #2a0e55;
      --gp: rgba(168,85,247,.28);
      --grad: linear-gradient(135deg,#a855f7,#3b82f6);
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--tx);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #bg {
      position: fixed; inset: 0; z-index: -1; overflow: hidden;
      pointer-events: none;
    }
    #bg-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(168,85,247,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168,85,247,.035) 1px, transparent 1px);
      background-size: 64px 64px;
    }
    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(90px);
    }
    #o1 { width:500px; height:500px; top:-200px; left:-200px;
          background: radial-gradient(circle,#7c3aed 0%,transparent 70%); opacity: .18; }
    #o2 { width:400px; height:400px; bottom:-180px; right:-180px;
          background: radial-gradient(circle,#3b82f6 0%,transparent 70%); opacity: .12; }
    #bg-vig {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 110% 110% at 50% 50%, transparent 35%, rgba(5,2,14,.85) 100%);
    }
    .container {
      width: 100%; max-width: 420px; padding: 2rem;
    }
    .card {
      background: rgba(11,4,32,.92);
      border: 1px solid var(--brd2);
      border-radius: 20px; padding: 2.5rem;
      box-shadow: 0 0 80px rgba(168,85,247,.06);
      backdrop-filter: blur(12px);
    }
    .logo {
      display: flex; align-items: center; gap: .65rem;
      text-decoration: none; color: var(--tx);
      font-weight: 800; font-size: 1.1rem; letter-spacing: -.3px;
      margin-bottom: 2rem; justify-content: center;
    }
    .logo-mark {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--grad);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .logo-mark::after {
      content: ''; position: absolute; inset: -3px; border-radius: 11px;
      background: var(--grad); z-index: -1; opacity: .4; filter: blur(9px);
    }
    .logo-mark svg { width: 18px; height: 18px; color: #fff; }
    h1 { font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: .3rem; }
    .sub { color: var(--tx2); text-align: center; font-size: .85rem; margin-bottom: 2rem; }
    .fg { margin-bottom: 1.25rem; }
    .fl { display: block; font-size: .8rem; font-weight: 600; color: var(--tx2); margin-bottom: .5rem; }
    .fi {
      width: 100%; padding: .85rem 1rem;
      background: var(--bg); border: 1px solid var(--brd);
      border-radius: 10px; color: var(--tx); font-family: inherit; font-size: .9rem;
      transition: all .3s;
    }
    .fi:focus { outline: none; border-color: var(--pu); box-shadow: 0 0 0 3px rgba(168,85,247,.12); }
    .fi::placeholder { color: var(--tx3); }
    .fi.error { border-color: #f87171; box-shadow: 0 0 0 3px rgba(248,113,113,.12); }
    .btn {
      width: 100%; padding: .9rem; border-radius: 10px;
      background: var(--grad); color: #fff; border: none;
      font-size: .9rem; font-weight: 600; cursor: pointer;
      transition: all .3s; box-shadow: 0 4px 20px var(--gp);
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 30px var(--gp); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .foot { text-align: center; margin-top: 1.5rem; font-size: .85rem; color: var(--tx3); }
    .foot a { color: var(--pu); text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
    .msg {
      padding: .75rem; border-radius: 8px; font-size: .82rem; margin-bottom: 1.25rem;
      display: none;
    }
    .msg.error { display: block; background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.25); color: #f87171; }
    .msg.success { display: block; background: rgba(74,222,128,.1); border: 1px solid rgba(74,222,128,.25); color: #4ade80; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--brd2); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="bg">
    <div id="bg-grid"></div>
    <div class="orb" id="o1"></div>
    <div class="orb" id="o2"></div>
    <div id="bg-vig"></div>
  </div>
  <div class="container">
    <div class="card">
      <a href="/" class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        DolphinEngineering
      </a>
      <h1>Iniciar Sesión</h1>
      <p class="sub">Accede a tu panel de cliente</p>
      <div class="msg" id="msg"></div>
      <form id="loginForm">
        <div class="fg">
          <label class="fl">Email</label>
          <input type="email" class="fi" id="email" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="fg">
          <label class="fl">Contraseña</label>
          <input type="password" class="fi" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Entrar</button>
      </form>
      <div class="foot">
        ¿No tienes cuenta? <a href="/register">Regístrate</a>
      </div>
    </div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      msg.style.display = 'none';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) {
        msg.className = 'msg error'; msg.textContent = 'Completa todos los campos'; return;
      }
      const btn = form.querySelector('button');
      btn.disabled = true; btn.textContent = 'Entrando...';
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const res = await r.json();
        if (res.success) {
          msg.className = 'msg success'; msg.textContent = 'Redirigiendo...';
          window.location.href = '/dashboard';
        } else {
          msg.className = 'msg error'; msg.textContent = res.message;
        }
      } catch {
        msg.className = 'msg error'; msg.textContent = 'Error de conexión';
      }
      btn.disabled = false; btn.textContent = 'Entrar';
    });
  </script>
</body>
</html>
