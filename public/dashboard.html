<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — DolphinEngineering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #05020e; --bg2: #09041a; --bg3: #0f0627;
      --pu: #a855f7; --pu2: #7c3aed; --pu3: #581c87;
      --bl: #60a5fa; --bl2: #3b82f6;
      --tx: #ede8f8; --tx2: #9d87bf; --tx3: #4e3a6e;
      --brd: #160537; --brd2: #2a0e55;
      --gp: rgba(168,85,247,.28);
      --grad: linear-gradient(135deg,#a855f7,#3b82f6);
      --ok: #4ade80; --err: #f87171; --warn: #fbbf24;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--tx);
      display: flex; min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--brd2); border-radius: 3px; }

    /* sidebar */
    #side {
      width: 260px; background: var(--bg2); border-right: 1px solid var(--brd);
      padding: 2rem 1.5rem; display: flex; flex-direction: column; flex-shrink: 0;
    }
    .side-logo {
      display: flex; align-items: center; gap: .65rem;
      text-decoration: none; color: var(--tx);
      font-weight: 800; font-size: 1rem; letter-spacing: -.3px;
      margin-bottom: 2.5rem;
    }
    .side-logo .mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--grad);
      display: flex; align-items: center; justify-content: center;
    }
    .side-logo .mark svg { width: 16px; height: 16px; color: #fff; }
    .nav-item {
      display: flex; align-items: center; gap: .75rem;
      padding: .75rem 1rem; border-radius: 10px;
      color: var(--tx2); text-decoration: none; font-size: .85rem; font-weight: 500;
      transition: all .2s; cursor: pointer; border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover { background: rgba(168,85,247,.08); color: var(--tx); }
    .nav-item.active { background: rgba(168,85,247,.12); color: var(--pu); }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .side-bot { margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--brd); }
    .badge-count {
      margin-left: auto; background: var(--err); color: #fff;
      font-size: .65rem; font-weight: 700; padding: .1rem .45rem;
      border-radius: 10px; min-width: 20px; text-align: center;
    }

    /* main */
    #main { flex: 1; overflow-y: auto; padding: 2rem 2.5rem; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem;
    }
    .topbar h2 { font-size: 1.3rem; font-weight: 700; }
    .topbar p { font-size: .82rem; color: var(--tx3); }
    .user-badge {
      display: flex; align-items: center; gap: .5rem;
      font-size: .82rem; color: var(--tx2);
    }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--grad); display: flex; align-items: center; justify-content: center;
      font-size: .8rem; font-weight: 700; color: #fff;
    }

    /* stats */
    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat {
      background: var(--bg2); border: 1px solid var(--brd); border-radius: 14px;
      padding: 1.25rem;
    }
    .stat-num {
      font-size: 1.6rem; font-weight: 800; letter-spacing: -1px;
      background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .stat-lbl { font-size: .72rem; color: var(--tx3); margin-top: .2rem; text-transform: uppercase; letter-spacing: .5px; }

    /* tables */
    .card {
      background: var(--bg2); border: 1px solid var(--brd); border-radius: 14px;
      padding: 1.5rem; margin-bottom: 1.5rem;
    }
    .card-hdr {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem;
    }
    .card-hdr h3 { font-size: .95rem; font-weight: 600; }
    .card-hdr .count { font-size: .75rem; color: var(--tx3); }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th { text-align: left; color: var(--tx3); font-weight: 600; font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; padding: .6rem .5rem; border-bottom: 1px solid var(--brd); }
    td { padding: .65rem .5rem; border-bottom: 1px solid var(--brd); color: var(--tx2); }
    tr:hover td { background: rgba(168,85,247,.03); }
    .tag {
      display: inline-block; font-size: .65rem; padding: .15rem .5rem;
      border-radius: 4px; font-weight: 500;
    }
    .tag.admin { background: rgba(168,85,247,.15); color: var(--pu); }
    .tag.user { background: rgba(96,165,250,.15); color: var(--bl); }
    .tag.unread { background: rgba(248,113,113,.15); color: var(--err); }
    .tag.read { background: rgba(74,222,128,.15); color: var(--ok); }
    .act-btn {
      background: none; border: 1px solid var(--brd2); color: var(--tx2);
      padding: .3rem .6rem; border-radius: 6px; cursor: pointer; font-size: .75rem;
      transition: all .2s;
    }
    .act-btn:hover { border-color: var(--err); color: var(--err); }
    .act-btn.ok:hover { border-color: var(--ok); color: var(--ok); }
    .empty {
      text-align: center; padding: 3rem; color: var(--tx3); font-size: .85rem;
    }

    /* section visibility */
    .section { display: none; }
    .section.active { display: block; }

    @media (max-width:768px) {
      #side { width: 60px; padding: 1rem .75rem; }
      #side .side-logo span, #side .nav-item span, #side .side-bot .nav-item span { display: none; }
      .side-logo { justify-content: center; }
      .stats { grid-template-columns: repeat(2,1fr); }
      #main { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>
  <!-- sidebar -->
  <nav id="side">
    <a href="/" class="side-logo">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <span>DolphinEngine</span>
    </a>
    <button class="nav-item active" data-section="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Panel</span>
    </button>
    <button class="nav-item" data-section="messages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <span>Mensajes</span>
      <span class="badge-count" id="unreadBadge" style="display:none">0</span>
    </button>
    <button class="nav-item" data-section="users">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <span>Usuarios</span>
    </button>
    <div class="side-bot">
      <button class="nav-item" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </nav>

  <!-- main -->
  <div id="main">
    <div class="topbar">
      <div>
        <h2>Dashboard</h2>
        <p id="greeting">Panel de administración</p>
      </div>
      <div class="user-badge">
        <span id="userName">Admin</span>
        <div class="user-avatar" id="userAvatar">A</div>
      </div>
    </div>

    <!-- overview -->
    <div class="section active" id="sec-overview">
      <div class="stats">
        <div class="stat"><div class="stat-num" id="statUsers">0</div><div class="stat-lbl">Usuarios Registrados</div></div>
        <div class="stat"><div class="stat-num" id="statMessages">0</div><div class="stat-lbl">Mensajes</div></div>
        <div class="stat"><div class="stat-num" id="statUnread">0</div><div class="stat-lbl">No Leídos</div></div>
        <div class="stat"><div class="stat-num" id="statRecent">0</div><div class="stat-lbl">Nuevos (7d)</div></div>
      </div>
      <div class="card">
        <div class="card-hdr"><h3>Últimos Mensajes</h3><span class="count" id="recentCount">0</span></div>
        <div id="recentMessages"><div class="empty">Cargando...</div></div>
      </div>
    </div>

    <!-- messages -->
    <div class="section" id="sec-messages">
      <div class="card">
        <div class="card-hdr"><h3>Todos los Mensajes</h3><span class="count" id="msgCount">0</span></div>
        <div id="messagesList"><div class="empty">Cargando...</div></div>
      </div>
    </div>

    <!-- users -->
    <div class="section" id="sec-users">
      <div class="card">
        <div class="card-hdr"><h3>Usuarios Registrados</h3><span class="count" id="userCount">0</span></div>
        <div id="usersList"><div class="empty">Cargando...</div></div>
      </div>
    </div>
  </div>

  <script>
    /* session check */
    async function checkSession() {
      try {
        const r = await fetch('/api/session');
        const d = await r.json();
        if (!d.authenticated) { window.location.href = '/client/login'; return; }
        if (d.role !== 'admin') { document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--err);font-size:1.2rem;font-weight:600">Acceso denegado</div>'; return; }
        document.getElementById('userName').textContent = d.name;
        document.getElementById('userAvatar').textContent = d.name.charAt(0).toUpperCase();
      } catch { window.location.href = '/client/login'; }
    }

    /* navigation */
    document.querySelectorAll('[data-section]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('sec-' + btn.dataset.section).classList.add('active');
      });
    });

    /* load data */
    async function loadStats() {
      const r = await fetch('/api/admin/stats');
      const d = await r.json();
      document.getElementById('statUsers').textContent = d.totalUsers;
      document.getElementById('statMessages').textContent = d.totalMessages;
      document.getElementById('statUnread').textContent = d.unreadMessages;
      document.getElementById('statRecent').textContent = d.recentUsers;
      if (d.unreadMessages > 0) {
        const badge = document.getElementById('unreadBadge');
        badge.textContent = d.unreadMessages;
        badge.style.display = '';
      }
    }

    async function loadMessages(limit) {
      const r = await fetch('/api/admin/messages');
      const msgs = await r.json();
      const recent = limit ? msgs.slice(0, limit) : msgs;
      const container = limit ? 'recentMessages' : 'messagesList';
      const countEl = limit ? 'recentCount' : 'msgCount';
      document.getElementById(countEl).textContent = msgs.length;
      if (!msgs.length) {
        document.getElementById(container).innerHTML = '<div class="empty">No hay mensajes recibidos</div>';
        return;
      }
      let html = '<table><thead><tr><th>Nombre</th><th>Email</th><th>Servicio</th><th>Mensaje</th><th>Fecha</th>' + (limit ? '' : '<th>Acción</th>') + '</tr></thead><tbody>';
      recent.forEach(m => {
        const preview = m.message.length > 60 ? m.message.slice(0, 60) + '...' : m.message;
        const date = new Date(m.created_at).toLocaleDateString('es-MX', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
        html += `<tr>
          <td>${m.name}</td>
          <td>${m.email}</td>
          <td>${m.service || '—'}</td>
          <td><span class="tag ${m.read ? 'read' : 'unread'}">${m.read ? 'Leído' : 'Nuevo'}</span> ${preview}</td>
          <td style="font-size:.75rem;color:var(--tx3)">${date}</td>
          ${limit ? '' : `<td><button class="act-btn ok" onclick="markRead(${m.id})">${m.read ? '✓' : 'Leído'}</button> <button class="act-btn" onclick="deleteMsg(${m.id})">✕</button></td>`}
        </tr>`;
      });
      html += '</tbody></table>';
      document.getElementById(container).innerHTML = html;
    }

    async function loadUsers() {
      const r = await fetch('/api/admin/users');
      const users = await r.json();
      document.getElementById('userCount').textContent = users.length;
      if (!users.length) {
        document.getElementById('usersList').innerHTML = '<div class="empty">No hay usuarios registrados</div>';
        return;
      }
      let html = '<table><thead><tr><th>Nombre</th><th>Email</th><th>Organización</th><th>Rol</th><th>Registro</th><th>Acción</th></tr></thead><tbody>';
      users.forEach(u => {
        const date = new Date(u.created_at).toLocaleDateString('es-MX', { day:'2-digit', month:'2-digit', year:'numeric' });
        html += `<tr>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td>${u.organization || '—'}</td>
          <td><span class="tag ${u.role}">${u.role}</span></td>
          <td style="font-size:.75rem;color:var(--tx3)">${date}</td>
          <td>${u.role === 'admin' ? '—' : `<button class="act-btn" onclick="deleteUser(${u.id})">✕</button>`}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      document.getElementById('usersList').innerHTML = html;
    }

    async function markRead(id) {
      await fetch('/api/admin/messages/' + id + '/read', { method: 'PUT' });
      loadMessages(false); loadStats();
    }
    async function deleteMsg(id) {
      if (!confirm('¿Eliminar este mensaje?')) return;
      await fetch('/api/admin/messages/' + id, { method: 'DELETE' });
      loadMessages(false); loadMessages(5); loadStats();
    }
    async function deleteUser(id) {
      if (!confirm('¿Eliminar este usuario?')) return;
      await fetch('/api/admin/users/' + id, { method: 'DELETE' });
      loadUsers(); loadStats();
    }

    /* logout */
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/client/login';
    });

    /* init */
    checkSession().then(() => {
      loadStats();
      loadMessages(5);
    });

    /* section loaders */
    document.querySelector('[data-section="messages"]').addEventListener('click', () => {
      setTimeout(() => loadMessages(false), 100);
    });
    document.querySelector('[data-section="users"]').addEventListener('click', () => {
      setTimeout(() => loadUsers(), 100);
    });
  </script>
</body>
</html>
