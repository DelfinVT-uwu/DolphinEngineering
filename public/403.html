<!DOCTYPE html>
<html lang="es">
<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

      font-family: 'Inter', system-ui, sans-serif;

      min-height: 100vh; display: flex;

    h1 { font-size: 5rem; font-weight: 800; background: linear-gradient(135deg,#a855f7,#3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    a { color: #a855f7; text-decoration: none; padding: .75rem 1.5rem; border: 1px solid #2a0e55; border-radius: 10px; transition: all .2s; }

  <div>
